services:
  - type: web
    name: gemforecast-igi-platform
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/jeweller_workspace.db
      - key: PORT
        value: 8080
      - key: FLASK_ENV
        value: production
    disk:
      name: gemforecast-data
      mountPath: /var/data
      sizeGB: 1
